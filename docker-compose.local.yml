version: "3.8"

services:
  db-local:
    image: postgres:17-alpine
    container_name: sunity_postgres_local
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sunity_dev}
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sunity_dev}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata_local:
